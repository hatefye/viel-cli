[package]
name = "viel"
version = "0.3.4"
edition = "2021"
description = "Terminal client for viel: search and watch movies, TV, and anime via mpv"
license = "MIT"
repository = "https://github.com/kashiuer/viel-cli"

[workspace]
members = ["mobile"]
resolver = "2"

[lib]
name = "viel"
path = "src/lib.rs"

[[bin]]
name = "viel"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:inquire", "dep:directories", "dep:toml", "dep:rand", "dep:crossterm", "dep:image", "dep:ratatui", "dep:ratatui-image"]

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
inquire = { version = "0.7", optional = true }
directories = { version = "5", optional = true }
toml = { version = "0.8", optional = true }
rand = { version = "0.8", optional = true }
crossterm = { version = "0.25", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
ratatui = { version = "0.30", optional = true }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"], optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
