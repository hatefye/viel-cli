[package]
name = "viel"
version = "0.1.0"
edition = "2021"
description = "Terminal client for viel: search and watch movies, TV, and anime via mpv"
license = "MIT"
repository = "https://github.com/kashiuer/viel-cli"

[[bin]]
name = "viel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
inquire = "0.7"
directories = "5"
toml = "0.8"
rand = "0.8"
crossterm = "0.25"
viuer = "0.7"
image = "0.24"
urlencoding = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
