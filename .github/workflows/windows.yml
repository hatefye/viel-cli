name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build
        run: cargo build -p viel-desktop --release

      - name: Fetch libmpv
        shell: pwsh
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261105/mpv-dev-x86_64-20261105-git-3138fc8eea.7z"
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev | Out-Null
          Get-ChildItem mpv-dev

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/viel.exe dist/
          Copy-Item mpv-dev/libmpv-2.dll dist/
          Copy-Item desktop/README.txt dist/
          Compress-Archive -Path dist/* -DestinationPath viel-windows.zip -Force

      - name: Installer
        shell: pwsh
        run: |
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsis) {
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (-not (Test-Path $candidate)) { choco install nsis -y --no-progress | Out-Null }
            $makensis = $candidate
          } else {
            $makensis = $nsis.Source
          }
          $version = (Select-String -Path desktop/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $makensis "/DVERSION=$version" desktop/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: viel-windows
          path: |
            viel-setup.exe
            viel-windows.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            viel-setup.exe
            viel-windows.zip
