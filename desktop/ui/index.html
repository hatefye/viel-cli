<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="ambient" class="ambient"><img alt=""><img alt=""></div>
<div id="dragbar" data-tauri-drag-region></div>
<div class="winctl">
  <button data-win="minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
  <button data-win="maximize" aria-label="Maximize"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
  <button data-win="close" class="x" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.1"/></svg></button>
</div>

<nav class="nav"><div class="pill" id="topnav">
  <button class="tab on" data-mode="home">Home</button>
  <button class="tab" data-mode="movie">Movies</button>
  <button class="tab" data-mode="tv">TV</button>
  <button class="tab" data-mode="anime">Anime</button>
  <span class="divide"></span>
  <button class="nicon" id="nav-search-btn" aria-label="Search" title="Search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </button>
  <button class="nicon" id="nav-history" aria-label="History" title="History">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
  </button>
  <button class="nicon" id="nav-downloads" aria-label="Downloads" title="Downloads">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
    <span class="dl-dot" id="dl-dot" hidden></span>
  </button>
  <button class="nicon" id="nav-settings" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
  </button>
  <button class="acct" id="nav-profile" aria-label="Account" title="Account">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
  </button>
</div></nav>

<div id="scroller">
  <section id="hero" class="hero"></section>
  <main id="content" class="container content"></main>
  <div class="foot">viel · <b id="foot-version"></b></div>
</div>

<div id="ov" class="ov">
  <div class="ov-bg"></div>
  <div class="sp">
    <div class="sf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="nav-search-input" placeholder="Search movies, series, anime" autocomplete="off" spellcheck="false">
      <span class="kbd">Esc</span>
    </div>
    <div class="sb">
      <div class="slab slab-recent" id="search-recent-label">Recent</div>
      <div class="schips" id="search-recent"></div>
      <div class="slab" id="search-results-title" hidden></div>
      <div class="stop" id="search-top"></div>
      <div class="sgrid" id="search-grid"></div>
    </div>
  </div>
</div>

<div id="info-ov" class="ov">
  <div class="ov-bg"></div>
  <div id="info-panel" class="ip"></div>
</div>

<div id="player" class="player-root" hidden>
  <header class="topbar">
    <div class="tb-left">
      <button class="back" id="pl-back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span class="back-label">Back</span>
      </button>
      <span class="tb-sep">/</span>
      <span class="tb-title" id="pl-name"></span>
      <span class="tb-source" id="pl-source"></span>
    </div>
    <div class="tb-center" id="pl-center-title"><span class="tb-ep" id="pl-ep"></span><span class="tb-epname" id="pl-epname"></span></div>
    <div class="tb-right"></div>
  </header>
  <div class="pause-overlay"></div>
  <div class="pause-info">
    <img class="show-logo" id="pl-logo" alt="" hidden>
    <h1 class="show-title" id="pl-showtitle"></h1>
    <div class="meta" id="pl-meta"></div>
    <h2 class="ep-title" id="pl-eptitle"></h2>
    <p class="desc" id="pl-desc"></p>
  </div>
  <div class="center-state">
    <div id="pl-flash" class="flash"></div>
    <div id="pl-spinner" class="spin" hidden></div>
    <div id="pl-status" class="status" hidden></div>
  </div>
  <button id="pl-skip" class="skip-btn" hidden></button>
  <div id="pl-next" class="next-card" hidden></div>
  <div class="controls" id="pl-controls">
    <div class="progress-row">
      <div class="progress" id="pl-scrub">
        <div class="rail"><div class="buffer"></div><div class="play"></div><div class="thumb"></div><div class="markers"></div></div>
        <div class="hover-time" hidden></div>
      </div>
    </div>
    <div class="controls-row">
      <div class="controls-left">
        <button id="pl-play" class="icon-btn" aria-label="Play or pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="pl-rew" class="icon-btn" aria-label="Rewind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a8 8 0 1 1-7.4 11M4 5v6h6"/></svg><b class="skipnum"></b></button>
        <button id="pl-ffw" class="icon-btn" aria-label="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a8 8 0 1 0 7.4 11M20 5v6h-6"/></svg><b class="skipnum"></b></button>
        <button id="pl-mute" class="icon-btn" aria-label="Mute"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
        <input id="pl-vol" class="volume-slider" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
        <div class="time"><span id="pl-pos">0:00</span> / <span id="pl-dur">0:00</span></div>
      </div>
      <div class="controls-right">
        <button id="pl-episodes" class="btn-with-label" aria-label="Episodes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="1.5"/><path d="M19 8v8M22 10v4"/></svg><span class="lbl">Episodes</span>
        </button>
        <button id="pl-nextbtn" class="icon-btn" aria-label="Next episode" title="Next episode"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l8 7-8 7V5zm10 0h2v14h-2V5z"/></svg></button>
        <button id="pl-cc" class="icon-btn" aria-label="Subtitles" title="Subtitles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 10H8a2 2 0 0 0 0 4h2M16 10h-2a2 2 0 0 0 0 4h2"/></svg></button>
        <button id="pl-audio" class="icon-btn" aria-label="Audio" title="Audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 16 0v5a2 2 0 0 1-2 2h-1v-6h3M4 12v5a2 2 0 0 0 2 2h1v-6H4"/></svg></button>
        <button id="pl-quality" class="icon-btn" aria-label="Quality and source" title="Quality"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M8 9v4M8 11h3M11 9v4M14 9h2a2 2 0 0 1 0 4h-2z"/></svg></button>
        <button id="pl-speed" class="btn-with-label" title="Speed"><span class="lbl">1×</span></button>
        <button id="pl-gear" class="icon-btn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg></button>
        <button id="pl-mini" class="icon-btn" aria-label="Mini player" title="Mini player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg></button>
        <button id="pl-full" class="icon-btn" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
  </div>
  <div id="pl-stats" class="stats" hidden></div>
  <div id="pl-menu" class="pmenu" hidden></div>
  <aside id="pl-panel" class="episodes-drawer" hidden></aside>
</div>

<div id="toast"></div>
<div id="ctx" class="pmenu" hidden></div>
<script src="app.js"></script>
</body>
</html>
