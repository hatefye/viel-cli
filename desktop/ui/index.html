        <div class="search-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
          <input id="search-input" type="text" placeholder="Episode # or title" autocomplete="off">
        </div>
        <div class="season-pill-wrap" id="season-pill-wrap">
          <button class="season-pill" type="button" id="season-pill-btn">
            <span id="season-pill-label"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <div class="season-dropdown" id="season-dropdown"></div>
        </div>
        <button class="autonext" type="button" id="autonext-btn">
          <span>Auto next</span>
          <span class="switch"></span>
        </button>
        <button class="drawer-close" aria-label="Close" id="drawer-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="season-banner">
        <div class="title" id="season-banner-title"></div>
        <p class="desc" id="season-banner-desc"></p>
      </div>
      <div class="ep-strip">
        <div class="episodes-stack sheet" id="episodes-stack"></div>
        <button type="button" class="ep-arrow l" id="ep-arrow-l" aria-label="Earlier episodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
        <button type="button" class="ep-arrow r" id="ep-arrow-r" aria-label="Later episodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
      </div>
      <button class="sheet-close" id="drawer-sheet-close" type="button">Close</button>
    </aside>
</div>

<div id="toast"></div>
<div id="ctx" class="pmenu" hidden></div>
<script src="app.js"></script>
</body>
</html>
